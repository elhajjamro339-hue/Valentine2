<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #ff6b9d;
            font-size: 2.5em;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        .gif-container {
            margin: 30px 0;
            height: 250px;
            overflow: hidden;
            border-radius: 15px;
            background: #f0f0f0;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .yes-btn {
            background: #ff6b9d;
            color: white;
            flex: 1;
            min-width: 120px;
        }

        .yes-btn:hover {
            background: #ff4757;
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(255, 107, 157, 0.4);
        }

        .no-btn {
            background: #95afc0;
            color: white;
            flex: 1;
            min-width: 120px;
            position: relative;
        }

        .no-btn:hover {
            transform: translateX(-20px);
        }

        .message {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #fff5e6;
            border-left: 5px solid #ff6b9d;
            border-radius: 10px;
            animation: slideIn 0.5s ease;
        }

        .message h2 {
            color: #ff6b9d;
            margin-bottom: 10px;
        }

        .message p {
            color: #333;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .celebration {
            display: none;
            margin-top: 20px;
            font-size: 2em;
        }
