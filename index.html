<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        /* التنسيقات التي وضعتها أنت */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #ff6b9d;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .yes-btn {
            background: #ff6b9d;
            color: white;
        }

        .no-btn {
            background: #95afc0;
            color: white;
            position: relative;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="question">هل تقبلين أن تكوني الفالنتاين الخاص بي؟ ❤️</h1>
        
        <div class="buttons-container">
            <button class="yes-btn" onclick="celebrate()">نعم بالتأكيد!</button>
            <button class="no-btn" id="noBtn" onmouseover="moveButton()">لا</button>
        </div>

        <div id="message" style="display:none;">
            <h2 style="color: #ff6b9d;">رائع! 🎉😍</h2>
            <p>كنت أعلم أنك ستوافقين!</p>
        </div>
    </div>

    <script>
        // وظيفة تجعل زر "لا" يهرب من الماوس
        function moveButton() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            
            btn.style.position = 'absolute';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        // وظيفة عند الضغط على "نعم"
        function celebrate() {
            document.getElementById('question').style.display = 'none';
            document.querySelector('.buttons-container').style.display = 'none';
            document.getElementById('message').style.display = 'block';
            document.body.style.backgroundColor = '#ff6b9d';
        }
    </script>
</body>
</html>
