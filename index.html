<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine's Day</title>
<style>
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background-color: #ffe6f2;
    font-family: Arial, sans-serif;
    text-align: center;
}

#container {
    background: white;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.1);
    max-width: 500px;
    width: 90%;
}

img {
    width: 250px;
    height: auto;
    border-radius: 15px;
    margin-bottom: 20px;
}

h1 {
    color: #333;
    margin-bottom: 25px;
    min-height: 60px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

button {
    padding: 12px 30px;
    font-size: 1.2rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    color: white;
}

#yesBtn { background-color: #28a745; } /* أخضر */
#noBtn { background-color: #dc3545; }  /* أحمر */

.hidden { display: none; }
</style>
</head>
<body>

<div id="container">
    <!-- GIF البداية -->
    <img id="mainGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpwaW94am93bmZ6eGZ6eGZ6eGZ6eGZ6eGZ6eGZ6eGZ6eGZ6JnB0PWFjdGl2ZV9mZWVk/c76IJLufpN61i/giphy.gif" alt="GIF">
    
    <h1 id="questionText">Will you be my Valentine? ❤️</h1>

    <div class="buttons">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>
</div>

<script>
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const questionText = document.getElementById('questionText');
const mainGif = document.getElementById('mainGif');

// الرسائل عند الضغط على No
const noMessages = [
    "Are you sure?",
    "Really??",
    "Think again!",
    "Last chance!"
];

let noCount = 0;

noBtn.addEventListener('click', () => {
    if (noCount < noMessages.length) {
        questionText.innerText = noMessages[noCount];
        noCount++;
    } else {
        // آخر ضغط No
        questionText.innerText = "Stop messing with me 😠";
        mainGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHpwaW94am93bmZ6eGZ6eGZ6eGZ6eGZ6eGZ6eGZ6eGZ6eGZ6JnB0PWFjdGl2ZV9mZWVk/ICOgUNoJGvSU0/giphy.gif"; // GIF يمكنك تغييره
        noBtn.classList.add('hidden'); // إخفاء زر No
    }
});

yesBtn.addEventListener('click', () => {
    questionText.innerText = "Thank you! I knew it! ❤️";
    mainGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpwaW94am93bmZ6eGZ6eGZ6eGZ6eGZ6eGZ6eGZ6eGZ6eGZ6JnB0PWFjdGl2ZV9mZWVk/l4pTdcifPKUYM/giphy.gif"; // GIF يمكنك تغييره
    yesBtn.classList.add('hidden'); // إخفاء زر Yes
});
</script>

</body>
</html>
